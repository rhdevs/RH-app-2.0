name: Transcript tests

# Runs the database-free unit tests on every pull request. The integration
# tests (*.int.test.ts) skip themselves unless a local development database is
# configured, so no database or secret is needed here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
